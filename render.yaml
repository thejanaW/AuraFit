services:
  - type: web
    name: aurafit-backend
    runtime: node
    plan: free
    region: singapore
    # Monorepo: build and run only the Express API in backend/
    repo: https://github.com/thejanaW/AuraFit
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render generates a strong random secret once and keeps it stable
      - key: JWT_SECRET
        generateValue: true
      # Secrets — fill these in the Dashboard when applying the Blueprint
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Public URL of aurafit-ml below. Set once after that service is live —
      # fromService only exposes host/port, and the backend needs a scheme.
      - key: ML_SERVICE_URL
        sync: false

  - type: web
    name: aurafit-ml
    runtime: python
    plan: free
    region: singapore
    # Monorepo: build and run only the FastAPI risk-scoring service
    repo: https://github.com/thejanaW/AuraFit
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: commit
    envVars:
      # Must stay 3.12 — requirements.txt pins numpy==2.0.2, which ships no
      # cp313 wheel. On Render's default Python the build falls back to
      # compiling numpy from source and fails.
      - key: PYTHON_VERSION
        value: "3.12"
